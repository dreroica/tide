<style>
  :root{
    --ink:#111A24;
    --ink-2:#4A5866;
    --paper:#EDF0F4;
    --card:#FFFFFF;
    --hair:#D5DCE4;
    --sign:#0B2545;
    --focus:#1B78E0;
    --sheet-h:0px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overscroll-behavior:none}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
    position:fixed;inset:0;
  }

  /* ── 표지판 헤더 ───────────────────────── */
  header{
    background:var(--sign);color:#fff;
    padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
    display:flex;align-items:center;gap:10px;
    box-shadow:0 1px 0 rgba(0,0,0,.15);
    z-index:30;
  }
  .brand{display:flex;align-items:baseline;gap:7px;flex:0 0 auto}
  .brand b{font-size:16px;font-weight:800;letter-spacing:-.03em}
  .brand span{font-size:10px;opacity:.6;letter-spacing:.14em;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .searchwrap{flex:1;position:relative;min-width:0}
  #search{
    width:100%;height:36px;border:0;border-radius:18px;
    background:rgba(255,255,255,.14);color:#fff;
    padding:0 14px 0 34px;font-size:14px;font-family:inherit;
    outline:2px solid transparent;outline-offset:-2px;
  }
  #search::placeholder{color:rgba(255,255,255,.55)}
  #search:focus{background:rgba(255,255,255,.22);outline-color:#7FB3F0}
  .mag{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.6;pointer-events:none}
  #results{
    position:absolute;top:42px;left:0;right:0;background:var(--card);
    border-radius:12px;box-shadow:0 12px 30px rgba(11,37,69,.28);
    max-height:46vh;overflow:auto;display:none;z-index:40;padding:4px;
  }
  #results.on{display:block}
  .rrow{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;cursor:pointer}
  .rrow:hover,.rrow[aria-selected="true"]{background:#EEF3F9}
  .rname{font-size:14px;font-weight:600;color:var(--ink)}
  .rempty{padding:14px 12px;font-size:13px;color:var(--ink-2)}

  /* ── 노선 배지 ─────────────────────────── */
  .bdg{
    width:19px;height:19px;border-radius:50%;flex:0 0 auto;
    display:inline-flex;align-items:center;justify-content:center;
    color:#fff;font-size:10.5px;font-weight:800;letter-spacing:-.04em;
  }
  .bdg.wide{width:auto;height:19px;padding:0 7px;border-radius:10px;font-size:10px}

  /* ── 지도 ─────────────────────────────── */
  main{flex:1;position:relative;overflow:hidden;touch-action:none}
  #map{width:100%;height:100%;display:block;cursor:grab;background:var(--paper)}
  #map.drag{cursor:grabbing}
  .rail{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:5.5}
  .st{pointer-events:auto;cursor:pointer}
  .dot{fill:#fff;stroke-width:2.2}
  .dot.minor{stroke-width:2}
  .lbl{
    font-size:11.5px;font-weight:650;fill:var(--ink);
    paint-order:stroke fill;stroke:#EDF0F4;stroke-width:3.4px;stroke-linejoin:round;
    pointer-events:none;letter-spacing:-.04em;
  }
  .st .lbl{display:none}
  .st.hub .lbl{display:block}
  svg[data-z="2"] .st.xfer .lbl{display:block}
  svg[data-z="3"] .st .lbl{display:block}
  svg[data-z="3"] .lbl{font-size:12px}
  .st.picked .lbl{display:block;fill:#fff;stroke:var(--sign);stroke-width:4px;font-weight:800}
  #halo{fill:none;stroke:var(--focus);stroke-width:3;opacity:0;pointer-events:none}

  /* ── 컨트롤 ───────────────────────────── */
  .zoombar{
    position:absolute;right:12px;bottom:calc(var(--sheet-h) + 76px);
    display:flex;flex-direction:column;background:var(--card);
    border-radius:12px;overflow:hidden;box-shadow:0 3px 14px rgba(17,26,36,.16);
  }
  .zoombar button{
    width:42px;height:42px;border:0;background:transparent;font-size:20px;
    color:var(--ink);cursor:pointer;font-family:inherit;line-height:1;
  }
  .zoombar button:active{background:#E7EDF4}
  .zoombar button+button{border-top:1px solid var(--hair)}
  .zoombar button.reset{font-size:12px;font-weight:700;letter-spacing:-.02em}

  .chips{
    position:absolute;left:0;right:0;bottom:calc(var(--sheet-h) + 10px);
    display:flex;gap:6px;overflow-x:auto;padding:6px 12px;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;display:flex;align-items:center;gap:6px;
    background:var(--card);border:1px solid var(--hair);border-radius:16px;
    padding:5px 11px 5px 6px;font-size:12px;font-weight:650;color:var(--ink);
    cursor:pointer;font-family:inherit;letter-spacing:-.03em;
    box-shadow:0 1px 4px rgba(17,26,36,.08);
  }
  .chip .sw{width:14px;height:14px;border-radius:50%}
  .chip[aria-pressed="false"]{opacity:.42;background:#E4E9EF}
  .chip.all{padding-left:11px}

  /* ── 역 정보 시트 ─────────────────────── */
  #sheet{
    position:absolute;left:0;right:0;bottom:0;background:var(--card);
    border-radius:18px 18px 0 0;box-shadow:0 -6px 26px rgba(17,26,36,.18);
    transform:translateY(102%);transition:transform .26s cubic-bezier(.22,.7,.3,1);
    padding:14px 16px calc(env(safe-area-inset-bottom) + 16px);z-index:20;
  }
  #sheet.on{transform:translateY(0)}
  .sheet-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  #sname{font-size:22px;font-weight:800;letter-spacing:-.045em;margin:0}
  #ssub{font-size:12px;color:var(--ink-2);margin:3px 0 0}
  .close{border:0;background:#EEF1F5;width:30px;height:30px;border-radius:50%;font-size:15px;color:var(--ink-2);cursor:pointer;flex:0 0 auto}
  #slines{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .lchip{display:flex;align-items:center;gap:7px;background:#F4F7FA;border-radius:9px;padding:6px 11px 6px 7px;font-size:13px;font-weight:650;letter-spacing:-.03em}

  .note{
    position:absolute;left:12px;top:10px;background:rgba(255,255,255,.9);
    border-radius:9px;padding:6px 9px;font-size:10.5px;color:var(--ink-2);
    line-height:1.45;max-width:52%;box-shadow:0 1px 5px rgba(17,26,36,.1);
    letter-spacing:-.02em;
  }
  @media (max-width:380px){ .note{display:none} }
  @media (prefers-reduced-motion:reduce){ #sheet{transition:none} }
</style>

</main>

/* 저배율에서도 항상 보이는 주요 환승 거점 */
const HUBS = new Set(["서울역","시청","종로3가","을지로3가","왕십리","청량리","신도림","사당","강남","교대","잠실","고속터미널","건대입구","홍대입구","합정","공덕","동대문역사문화공원","충무로","노원","선릉","여의도","당산","천호","가산디지털단지","군자","석계","김포공항","수서","연신내","종합운동장","구로","까치산","대림","신설동","디지털미디어시티","삼각지","온수","오금","모란"]);

/* ============================================================
   투영 + 노드 구성
   ============================================================ */
const K = 4000, LATK = 1.0, LNGK = Math.cos(37.55*Math.PI/180);
const nodes = new Map();
function node(name, lat, lng){
  let n = nodes.get(name);
  if(!n){
    n = {name, x:lng*LNGK*K, y:-lat*LATK*K, lines:[], nbr:[], el:null};
    nodes.set(name, n);
  }
  return n;
}
LINES.forEach(L=>{
  L.paths.forEach(p=>{
    const ns = p.map(s=>node(s[0], s[1], s[2]));
    ns.forEach((n,i)=>{
      if(!n.lines.includes(L)) n.lines.push(L);
      if(i>0) n.nbr.push(ns[i-1]);
      if(i<ns.length-1) n.nbr.push(ns[i+1]);
    });
    L._pts = L._pts || [];
    L._pts.push(ns);
  });
});

/* 라벨 위치: 노선이 가로로 지나면 위쪽, 세로로 지나면 오른쪽 */
nodes.forEach(n=>{
  let dx=0, dy=0;
  n.nbr.forEach(m=>{ dx += Math.abs(m.x-n.x); dy += Math.abs(m.y-n.y); });
  n.side = (dx > dy*1.1) ? "top" : "right";
});

/* 화면 좌표계 정규화 */
let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
nodes.forEach(n=>{minX=Math.min(minX,n.x);maxX=Math.max(maxX,n.x);minY=Math.min(minY,n.y);maxY=Math.max(maxY,n.y)});
nodes.forEach(n=>{ n.x-=minX; n.y-=minY; });
const W0 = maxX-minX, H0 = maxY-minY;

/* ============================================================
   렌더링
   ============================================================ */
const svg=document.getElementById("map"), gL=document.getElementById("glines"),
      gS=document.getElementById("gstations"), halo=document.getElementById("halo");
const NS="http://www.w3.org/2000/svg";
const off = new Set();   // 숨긴 노선 id

LINES.forEach(L=>{
  L._els = L._pts.map(ns=>{
    const pl=document.createElementNS(NS,"polyline");
    pl.setAttribute("class","rail");
    pl.setAttribute("stroke",L.color);
    pl.setAttribute("vector-effect","non-scaling-stroke");
    pl.setAttribute("points", ns.map(n=>n.x.toFixed(1)+","+n.y.toFixed(1)).join(" "));
    gL.appendChild(pl);
    return pl;
  });
});

nodes.forEach(n=>{
  const g=document.createElementNS(NS,"g");
  g.setAttribute("class","st"+(n.lines.length>1?" xfer":"")+(HUBS.has(n.name)?" hub":""));
  const c=document.createElementNS(NS,"circle");
  const xfer=n.lines.length>1;
  c.setAttribute("class","dot"+(xfer?"":" minor"));
  c.setAttribute("r", xfer?5.4:3.6);
  c.setAttribute("stroke", xfer?"#2B3947":n.lines[0].color);
  const t=document.createElementNS(NS,"text");
  t.setAttribute("class","lbl");
  if(n.side==="top"){ t.setAttribute("text-anchor","middle"); t.setAttribute("y",-9); }
  else { t.setAttribute("text-anchor","start"); t.setAttribute("x",8.5); t.setAttribute("y",4); }
  t.textContent=n.name;
  g.append(c,t);
  g.addEventListener("click",e=>{e.stopPropagation();select(n)});
  gS.appendChild(g);
  n.el=g; n.dotEl=c;
});

/* ── 뷰 상태 ── */
let scale=1, tx=0, ty=0, fit=1, needFrame=false;
function viewport(){ return {w:svg.clientWidth, h:svg.clientHeight}; }

function fitAll(animate){
  const {w,h}=viewport();
  fit=Math.min((w-40)/W0,(h-150)/H0);
  scale=fit;
  tx=(w-W0*scale)/2;
  ty=(h-H0*scale)/2;
  draw();
}
function clampScale(s){ return Math.max(fit*0.85, Math.min(fit*14, s)); }

function draw(){
  gL.setAttribute("transform",`translate(${tx.toFixed(2)},${ty.toFixed(2)}) scale(${scale.toFixed(4)})`);
  const z=scale/fit;
  svg.dataset.z = z<1.7 ? "1" : (z<3.1 ? "2" : "3");
  const {w,h}=viewport(), m=90;
  nodes.forEach(n=>{
    const hidden = n.lines.every(L=>off.has(L.id));
    if(hidden){ if(n.el.style.display!=="none") n.el.style.display="none"; return; }
    const sx=n.x*scale+tx, sy=n.y*scale+ty;
    if(sx<-m||sy<-m||sx>w+m||sy>h+m){ if(n.el.style.display!=="none") n.el.style.display="none"; return; }
    if(n.el.style.display==="none") n.el.style.display="";
    n.el.setAttribute("transform",`translate(${sx.toFixed(1)},${sy.toFixed(1)})`);
  });
  if(picked){
    halo.setAttribute("cx",(picked.x*scale+tx).toFixed(1));
    halo.setAttribute("cy",(picked.y*scale+ty).toFixed(1));
  }
}
function requestDraw(){ if(needFrame) return; needFrame=true; requestAnimationFrame(()=>{needFrame=false; draw();}); }

/* ── 입력: 드래그 / 휠 / 핀치 ── */
const pts=new Map(); let pinch=null;
svg.addEventListener("pointerdown",e=>{
  svg.setPointerCapture(e.pointerId);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  svg.classList.add("drag");
  if(pts.size===2){
    const [a,b]=[...pts.values()];
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y), cx:(a.x+b.x)/2, cy:(a.y+b.y)/2};
  }
});
svg.addEventListener("pointermove",e=>{
  if(!pts.has(e.pointerId)) return;
  const prev=pts.get(e.pointerId);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){
    tx+=e.clientX-prev.x; ty+=e.clientY-prev.y; requestDraw();
  } else if(pts.size===2 && pinch){
    const [a,b]=[...pts.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y), cx=(a.x+b.x)/2, cy=(a.y+b.y)/2;
    const r=svg.getBoundingClientRect();
    zoomAt(cx-r.left, cy-r.top, d/pinch.d);
    tx+=cx-pinch.cx; ty+=cy-pinch.cy;
    pinch={d,cx,cy}; requestDraw();
  }
});
["pointerup","pointercancel","pointerleave"].forEach(ev=>svg.addEventListener(ev,e=>{
  pts.delete(e.pointerId); if(pts.size<2) pinch=null;
  if(!pts.size) svg.classList.remove("drag");
}));
svg.addEventListener("wheel",e=>{
  e.preventDefault();
  const r=svg.getBoundingClientRect();
  zoomAt(e.clientX-r.left,e.clientY-r.top, Math.exp(-e.deltaY*0.0016));
  requestDraw();
},{passive:false});
svg.addEventListener("click",()=>closeSheet());
svg.addEventListener("dblclick",e=>{
  const r=svg.getBoundingClientRect();
  zoomAt(e.clientX-r.left,e.clientY-r.top,1.8); draw();
});

function zoomAt(px,py,f){
  const ns=clampScale(scale*f), k=ns/scale;
  tx=px-(px-tx)*k; ty=py-(py-ty)*k; scale=ns;
}
function zoomCenter(f){ const {w,h}=viewport(); zoomAt(w/2,h/2,f); draw(); }
document.getElementById("zin").onclick=()=>zoomCenter(1.5);
document.getElementById("zout").onclick=()=>zoomCenter(1/1.5);
document.getElementById("zreset").onclick=()=>{picked=null;halo.style.opacity=0;closeSheet();fitAll()};

/* ── 노선 필터 칩 ── */
const chips=document.getElementById("chips");
LINES.forEach(L=>{
  const b=document.createElement("button");
  b.className="chip"; b.setAttribute("aria-pressed","true");
  b.innerHTML=`<span class="sw" style="background:${L.color}"></span>${L.name}`;
  b.onclick=()=>{
    const on=b.getAttribute("aria-pressed")==="true";
    b.setAttribute("aria-pressed", on?"false":"true");
    on?off.add(L.id):off.delete(L.id);
    L._els.forEach(el=>el.style.display= on?"none":"");
    draw();
  };
  chips.appendChild(b);
});

/* ── 검색 ── */
const search=document.getElementById("search"), results=document.getElementById("results");
const allNames=[...nodes.keys()].sort((a,b)=>a.localeCompare(b,"ko"));
search.addEventListener("input",()=>{
  const q=search.value.trim();
  if(!q){ results.classList.remove("on"); return; }
  const hit=allNames.filter(n=>n.includes(q)).slice(0,25);
  results.innerHTML = hit.length
    ? hit.map(n=>{
        const nd=nodes.get(n);
        const b=nd.lines.map(L=>`<span class="bdg${L.wide?" wide":""}" style="background:${L.color}">${L.badge}</span>`).join("");
        return `<div class="rrow" data-n="${n}" role="option">${b}<span class="rname">${n}</span></div>`;
      }).join("")
    : `<div class="rempty">‘${q}’과(와) 일치하는 역이 없습니다.</div>`;
  results.classList.add("on");
});
results.addEventListener("click",e=>{
  const row=e.target.closest(".rrow"); if(!row) return;
  goTo(nodes.get(row.dataset.n));
  results.classList.remove("on"); search.blur();
});
search.addEventListener("keydown",e=>{
  if(e.key==="Enter"){ const f=results.querySelector(".rrow"); if(f){ goTo(nodes.get(f.dataset.n)); results.classList.remove("on"); search.blur(); } }
  if(e.key==="Escape"){ results.classList.remove("on"); search.blur(); }
});
document.addEventListener("click",e=>{ if(!e.target.closest(".searchwrap")) results.classList.remove("on"); });

function goTo(n){
  const {w,h}=viewport();
  scale=clampScale(fit*5);
  tx=w/2-n.x*scale; ty=(h*0.42)-n.y*scale;
  select(n);
}

/* ── 역 정보 시트 ── */
let picked=null;
const sheet=document.getElementById("sheet"), sname=document.getElementById("sname"),
      ssub=document.getElementById("ssub"), slines=document.getElementById("slines");
function select(n){
  if(picked) picked.el.classList.remove("picked");
  picked=n; n.el.classList.add("picked");
  halo.style.opacity=.9;
  sname.textContent=n.name;
  ssub.textContent = n.lines.length>1 ? `${n.lines.length}개 노선 환승역` : "일반역";
  slines.innerHTML=n.lines.map(L=>
    `<span class="lchip"><span class="bdg${L.wide?" wide":""}" style="background:${L.color}">${L.badge}</span>${L.name}</span>`).join("");
  sheet.classList.add("on");
  document.documentElement.style.setProperty("--sheet-h", sheet.offsetHeight+"px");
  draw();
}
function closeSheet(){
  sheet.classList.remove("on");
  document.documentElement.style.setProperty("--sheet-h","0px");
  if(picked){ picked.el.classList.remove("picked"); picked=null; }
  halo.style.opacity=0;
}
document.getElementById("sclose").onclick=e=>{e.stopPropagation();closeSheet()};
sheet.addEventListener("click",e=>e.stopPropagation());

/* ── 시작 ── */
addEventListener("resize",()=>{ const z=scale/fit; fitAll(); scale=clampScale(fit*z); draw(); });
fitAll();

/* 오프라인 실행용 서비스워커 (https 또는 localhost에서만 동작) */
if("serviceWorker" in navigator){
  addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
